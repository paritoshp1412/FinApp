<!doctype html>
<html lang="en" data-theme="swiss">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0b"/>
<title>Ledger — personal finance, run like a firm</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* NOIR - black & white, one red signal (default) */
/* NOIR - black & white, one red signal */
:root{
  --bg:#0a0a0b; --surface:#141416; --surface2:#1c1c1f; --line:#2a2a2e; --line2:#3a3a40;
  --ink:#f4f4f2; --ink2:#b2b2b4; --ink3:#77777b;
  --accent:#f2f2ef; --accent-dim:#242428; --on-accent:#0a0a0b;
  --gilt:#909095; --gilt-dim:#2c2c30; --rule:#909095;
  --pos:#ececea; --neg:#d6524f; --warn:#d6524f; --blue:#8a8a8f;
  --t-eq:#d3d7da; --t-debt:#8f97a0; --t-gold:#c7a25e; --t-cash:#8fb1a4; --t-other:#b29bb4;
  --t-ess:#8fb1a4; --t-disc:#cf8f6a;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 16px 40px -12px rgba(0,0,0,.7);
  --radius:13px;
}
/* SWISS - white ground, primary blue #3A63F9, red #EB1000 + yellow #F3C600 (Bauhaus) */
[data-theme="swiss"]{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f2f4f8; --line:#e4e7ee; --line2:#cfd4de;
  --ink:#0b0d12; --ink2:#474d59; --ink3:#8b91a0;
  --accent:#3A63F9; --accent-dim:#e4eaff; --on-accent:#ffffff;
  --gilt:#EB1000; --gilt-dim:#f7d7d0; --rule:#0b0d12;
  --pos:#3A63F9; --neg:#EB1000; --warn:#EB1000; --blue:#111827;
  --t-eq:#3A63F9; --t-debt:#111827; --t-gold:#F3C600; --t-cash:#3aa0ff; --t-other:#EB1000;
  --t-ess:#3A63F9; --t-disc:#EB1000;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 10px 26px -14px rgba(15,23,42,.16);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 700px at 78% -8%, color-mix(in srgb,var(--accent) 5%,transparent), transparent 60%);
  background-attachment:fixed;
}
::selection{background:var(--accent-dim);color:var(--ink)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0;font-weight:600;letter-spacing:-.015em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---- app frame ---- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 78%,var(--bg)));
  border-right:1px solid var(--line);padding:24px 14px 20px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;box-shadow:1px 0 0 color-mix(in srgb,var(--gilt) 18%,transparent);
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 18px}
.seal{width:38px;height:38px;flex:0 0 38px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.wm{display:flex;flex-direction:column;gap:1px;line-height:1}
.wm b{font-family:"Space Grotesk";font-size:20px;font-weight:700;letter-spacing:-.03em}
.wm .tag{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gilt);font-weight:600;margin-top:3px}
.navlabel{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);font-weight:600;
  padding:0 12px;margin:16px 0 7px;display:flex;align-items:center;gap:9px}
.navlabel::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:0;color:var(--ink2);padding:9px 13px;border-radius:9px;cursor:pointer;
  font-size:13.5px;font-weight:500;transition:background .16s,color .16s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--surface2);color:var(--ink);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--gilt)}
.nav button.on .k{color:var(--accent)}
.nav .k{width:17px;text-align:center;color:var(--ink3);font-size:13px;transition:color .16s}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:6px}

/* ---- header ---- */
.main{padding:28px 34px 64px;max-width:1200px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;
  flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);position:relative}
.top::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:2px;background:var(--gilt)}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gilt);font-weight:600;margin-bottom:9px}
.top h1{font-size:25px}
.top .sub{color:var(--ink3);font-size:12.5px;margin-top:4px}
.actions{display:flex;gap:8px;align-items:center}

/* ---- buttons ---- */
.btn{background:var(--surface);border:1px solid var(--line2);color:var(--ink);padding:9px 13px;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.p:hover{filter:brightness(1.05);color:var(--on-accent)}
.btn.sm{padding:6px 10px;font-size:12px}

/* ---- grid + cards ---- */
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow)}
.card h3{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:13px}
.kpi{transition:transform .16s,border-color .16s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi .label{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.11em;font-weight:600}
.kpi .val{font-family:"JetBrains Mono";font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:9px;line-height:1}
.kpi .note{font-size:12px;color:var(--ink2);margin-top:9px}
.hero{position:relative;overflow:hidden;grid-column:span 2;
  background:linear-gradient(150deg,var(--surface),var(--surface2));border-color:var(--line2)}
.hero::after{content:"";position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;
  border:1.4px solid var(--gilt);opacity:.45}
.hero::before{content:"";position:absolute;right:24px;top:24px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--gilt);opacity:.3}
.hero .val{font-size:41px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.chip{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;background:var(--surface2);
  color:var(--ink2);border:1px solid var(--line);letter-spacing:.02em}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;
  position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-family:"JetBrains Mono";font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface2)}
.tablewrap{max-height:600px;overflow:auto;border-radius:11px;border:1px solid var(--line)}
.muted{color:var(--ink3)}
.sec-row td{background:var(--surface2);font-weight:600;font-family:"Space Grotesk";text-transform:none;
  color:var(--ink);border-top:1px solid var(--line2);position:relative;letter-spacing:-.01em}
.sec-row td:first-child{box-shadow:inset 3px 0 0 var(--gilt)}
.sub-row td{font-weight:600;background:color-mix(in srgb,var(--accent) 8%,transparent);border-top:1px solid var(--gilt-dim)}
.tot-row td{font-weight:700;border-top:3px double var(--line2)}
.stmt td,.stmt th{padding:9px 14px;white-space:nowrap}
.stmt td:first-child,.stmt th:first-child{position:sticky;left:0;background:var(--surface);z-index:2;min-width:172px;
  box-shadow:1px 0 0 var(--line)}
.stmt .sec-row td:first-child,.stmt .sub-row td:first-child,.stmt .tot-row td:first-child{background:var(--surface2)}
.stmt tbody tr:hover td{background:var(--surface2)}
.stmt .n{min-width:80px}
.stmt td.n+td.n{border-left:1px solid transparent}
.stmt td:last-child,.stmt th:last-child{border-left:1px solid var(--gilt-dim);font-weight:600}

/* ---- forms ---- */
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:span 2}
label{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
input,select{background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:9px 11px;border-radius:8px;
  font-size:13px;font-family:inherit;width:100%;transition:border-color .15s}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input.mono{font-family:"JetBrains Mono"}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;padding:0;border:0;background:var(--line2);border-radius:4px;width:200px}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface)}
.check{font-size:12.5px;padding:9px 13px;border-radius:8px;margin-top:14px}
.check.ok{background:var(--accent-dim);color:var(--ink)}
.check.bad{background:color-mix(in srgb,var(--neg) 18%,transparent);color:var(--neg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.filters input,.filters select{width:auto;min-width:112px}
.filters label{align-self:center}

/* ---- quick add (mobile capture) ---- */
.cap-wrap{max-width:480px}
#capBody .card{margin-bottom:14px}
.cap-tabs{margin-bottom:16px}
.cap-amt{position:relative}
.cap-amt .rup{position:absolute;left:14px;top:32px;color:var(--ink3);font-size:20px;font-family:"JetBrains Mono"}
.cap-amt input{font-family:"JetBrains Mono";font-size:22px;font-weight:600;padding:12px 12px 12px 32px}
.cap-daterow{display:flex;gap:8px}
.cap-daterow input{flex:1}
.cap-chip{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);border-radius:8px;padding:0 12px;font-size:12px;font-weight:600;cursor:pointer}
.cap-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.cap-row:last-child{border-bottom:0}
.cap-row .l{flex:1;min-width:0}
.cap-row .kind{font-size:13px;font-weight:600}
.cap-row .meta{color:var(--ink3);font-size:11.5px;margin-top:2px}
.cap-row .amt{font-family:"JetBrains Mono";font-weight:600;font-size:14px;white-space:nowrap}
.cap-row .amt.exp{color:var(--neg)}
.cap-row .acts{display:flex;gap:6px;margin-top:5px}
.cap-row .acts span{font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:7px;padding:2px 7px;cursor:pointer}
.cap-kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cap-kv:last-child{border-bottom:0}
.cap-kv .k{color:var(--ink3)}
.cap-kv .v{font-family:"JetBrains Mono"}
.cap-danger{border:1px solid color-mix(in srgb,var(--neg) 40%,var(--line));border-radius:var(--radius);padding:16px;background:color-mix(in srgb,var(--neg) 6%,var(--surface));margin-bottom:14px}
.cap-danger h3{color:var(--neg)}

/* ---- bars / legend / charts ---- */
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-top:12px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
canvas{max-width:100%}

/* ---- views / states ---- */
.view{display:none}
.view.on{display:block;animation:viewIn .34s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:76px 20px;color:var(--ink3)}
.empty h2{font-size:20px;color:var(--ink);margin-bottom:9px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 19px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:.25s;
  pointer-events:none;z-index:50;box-shadow:0 10px 30px -6px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.switch{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.switch button{border:0;background:none;color:var(--ink2);padding:6px 13px;border-radius:6px;font-size:12px;cursor:pointer;
  font-weight:500;transition:background .15s,color .15s}
.switch button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.act{cursor:pointer;color:var(--ink3);padding:2px 6px;border-radius:6px;transition:color .15s,background .15s}
.act:hover{color:var(--accent);background:var(--surface2)}
.act.del:hover{color:var(--neg)}
th.srt{cursor:pointer;user-select:none;transition:color .15s}
th.srt:hover{color:var(--accent)}
.exp-toggle{cursor:pointer;user-select:none;color:var(--ink3);display:inline-block;width:15px}
.exp-toggle:hover{color:var(--accent)}
.sub-detail td{color:var(--ink2);font-size:12.5px;background:color-mix(in srgb,var(--ink) 2%,transparent)}
.sub-detail td:first-child{padding-left:30px}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:16px;box-shadow:0 1px 0 color-mix(in srgb,var(--gilt) 18%,transparent)}
  .brand{padding-bottom:12px}
  .navlabel{margin:10px 0 6px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav button{width:auto}
  .nav button.on::before{display:none}
  .nav button.on{box-shadow:inset 0 -2px 0 var(--gilt)}
  .side .foot{flex-direction:row;flex-wrap:wrap;margin-top:14px}
  .main{padding:22px 18px 48px}
  .g4,.g3,.g2,.hero{grid-template-columns:1fr}
  .hero{grid-column:auto}
  .form{grid-template-columns:1fr 1fr}
  .field.wide{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- theme picker ---- */
.themepick{display:flex;gap:6px}
.themepick .tp{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface);
  border:1px solid var(--line2);color:var(--ink2);padding:8px 9px;border-radius:9px;cursor:pointer;
  font-size:12.5px;font-weight:500;transition:color .15s,border-color .15s,box-shadow .15s}
.themepick .tp:hover{color:var(--ink);border-color:var(--ink3)}
.themepick .tp.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.themepick .sw{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw-noir{background:linear-gradient(135deg,#0a0a0b 0 50%,#f2f2ef 50% 100%)}
.sw-swiss{background:linear-gradient(135deg,#ffffff 0 40%,#3A63F9 40% 62%,#EB1000 62% 82%,#F3C600 82% 100%)}

/* ---- coloured tags ---- */
.chip[class*='t-']{color:var(--ink)}
.chip.t-eq::before,.chip.t-debt::before,.chip.t-gold::before,.chip.t-cash::before,.chip.t-other::before,.chip.t-ess::before,.chip.t-disc::before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chip.t-eq{border-color:color-mix(in srgb,var(--t-eq) 40%,transparent);background:color-mix(in srgb,var(--t-eq) 13%,transparent)}
.chip.t-eq::before{background:var(--t-eq)}
.chip.t-debt{border-color:color-mix(in srgb,var(--t-debt) 40%,transparent);background:color-mix(in srgb,var(--t-debt) 13%,transparent)}
.chip.t-debt::before{background:var(--t-debt)}
.chip.t-gold{border-color:color-mix(in srgb,var(--t-gold) 40%,transparent);background:color-mix(in srgb,var(--t-gold) 13%,transparent)}
.chip.t-gold::before{background:var(--t-gold)}
.chip.t-cash{border-color:color-mix(in srgb,var(--t-cash) 40%,transparent);background:color-mix(in srgb,var(--t-cash) 13%,transparent)}
.chip.t-cash::before{background:var(--t-cash)}
.chip.t-other{border-color:color-mix(in srgb,var(--t-other) 40%,transparent);background:color-mix(in srgb,var(--t-other) 13%,transparent)}
.chip.t-other::before{background:var(--t-other)}
.chip.t-ess{border-color:color-mix(in srgb,var(--t-ess) 40%,transparent);background:color-mix(in srgb,var(--t-ess) 13%,transparent)}
.chip.t-ess::before{background:var(--t-ess)}
.chip.t-disc{border-color:color-mix(in srgb,var(--t-disc) 40%,transparent);background:color-mix(in srgb,var(--t-disc) 13%,transparent)}
.chip.t-disc::before{background:var(--t-disc)}

/* ---- charts ---- */
.cx{width:100%;margin-top:4px}
.cx-svg{display:block;width:100%;height:auto;overflow:visible}
.cx-svg text{font-family:"JetBrains Mono",ui-monospace,monospace}
.cx-v{font-size:9.5px;font-weight:600;text-anchor:middle}
.cx-x{font-size:9.5px;fill:var(--ink3);text-anchor:middle}
.cx-lg{font-size:10.5px;fill:var(--ink2);font-family:Inter,sans-serif}
.cx-end{font-size:10px;font-weight:600;text-anchor:start}
.sh{margin-top:6px}
.sh-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.sh-seg{display:flex;align-items:center;justify-content:center;min-width:2px;transition:filter .15s}
.sh-seg:hover{filter:brightness(1.12)}
.sh-seg span{font:600 10px "JetBrains Mono",monospace}
.sh-leg{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.sh-row{display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
.sh-row:last-child{border-bottom:0}
.sh-sw{width:11px;height:11px;border-radius:3px}
.sh-lb{font-size:12.5px;color:var(--ink)}
.sh-vl{font-size:12.5px;color:var(--ink);min-width:82px;text-align:right}
.sh-pc{font-size:12px;color:var(--ink3);min-width:50px;text-align:right}

/* ---- Swiss (Bauhaus) highlight accents ---- */
[data-theme="swiss"] .top::after{width:132px;height:4px;background:linear-gradient(90deg,var(--accent) 0 38%,#EB1000 38% 70%,#F3C600 70% 100%)}
[data-theme="swiss"] .card h3::before{content:"";display:inline-block;width:15px;height:3px;background:#EB1000;margin-right:9px;vertical-align:middle;position:relative;top:-3px}
[data-theme="swiss"] .hero{border-left:4px solid var(--accent)}
[data-theme="swiss"] .hero::before{display:none}
[data-theme="swiss"] .hero::after{width:22px;height:22px;border-radius:0;border:0;background:#F3C600;opacity:1;top:16px;right:16px}

<script>
/* ===== CONFIG ===== */
const KINDS={
 "Spend - Bank/Cash":{t:"Expense",cf:"Operating",cr:1},"Spend - Credit Card":{t:"Expense",cf:"Operating",cr:1},
 "Spend - Friend Paid (I owe)":{t:"Expense",cf:"Operating",cr:1},"Salary / Recurring Income":{t:"Income",cf:"Operating",cr:1},
 "Windfall Income":{t:"Income",cf:"Operating",cr:1},"Transfer - Between My Accounts":{t:"Transfer",cf:"Internal",cr:0},
 "Cash Withdrawal":{t:"Transfer",cf:"Internal",cr:0},"Credit Card Bill Payment":{t:"Transfer",cf:"Financing",cr:0},
 "Invest - Buy":{t:"Transfer",cf:"Investing",cr:0},"Divest - Sell":{t:"Transfer",cf:"Investing",cr:0},
 "Reimbursable Spend (Claim)":{t:"Transfer",cf:"Operating",cr:0},"Claim Reimbursed":{t:"Transfer",cf:"Operating",cr:0},
 "I Paid for Others (Splitwise)":{t:"Transfer",cf:"Internal",cr:0},"Splitwise Settle - I Receive":{t:"Transfer",cf:"Internal",cr:0},
 "Splitwise Settle - I Pay":{t:"Transfer",cf:"Internal",cr:0},"Loan / Credit Taken":{t:"Transfer",cf:"Financing",cr:0},
 "Loan Repayment":{t:"Transfer",cf:"Financing",cr:0},"Capital Loss (realized)":{t:"Expense",cf:"Investing",cr:1}
};
const EXT="External / World";
let ACCOUNTS=[["SBI","Bank"],["Axis","Bank"],["HDFC","Bank"],["Niyo","Bank"],["Cash","Cash"],["Splitwise","Receivable"],["Employer Receivable","Receivable"],["Zerodha","Investment"],["ESPP","Investment"],["RSU","Investment"],["Deposit","Deposit"],["Diners Card","Credit Card"],["MyZone Card","Credit Card"],["Personal Loan","Loan"],["Transfers Clearing","Clearing"],[EXT,"External"]].map(a=>({name:a[0],kind:a[1],open:0}));
let CATS=[];
const STORE="ledger_app_v7";
let S={txns:[],holdings:[],accounts:ACCOUNTS,cats:CATS,subcats:{},budget:[],targetMix:null,plan:null,loaded:false};
const colToIdx=s=>{let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n-1;};
// Read a subcategory list straight from the worksheet: start at the named-range's column+row, read down until blank.
function readNamedCol(ws,ref){const rng=String(ref).replace(/\$/g,"").split("!").pop();const m=rng.match(/([A-Z]+)(\d+)/);if(!m||!ws)return[];const col=m[1],r1=+m[2];const out=[];for(let r=r1;r<r1+300;r++){const cell=ws[col+r];const v=cell?cell.v:null;if(v==null||String(v).trim()==="")break;out.push(String(v).trim());}return out;}
let M={}, ovSel="All", editIx=-1, isMode="annual", holdEditIx=-1, sortHold={col:null,dir:1}, sortCat={col:"total",dir:-1}, expandedCats=new Set(), budgetSel="";
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmtN=x=>{if(x==null||isNaN(x))return "&ndash;";const n=Math.round(x);return (n<0?"&minus;":"")+"&#8377;"+Math.abs(n).toLocaleString("en-IN");};
const fmtP=x=>{if(x==null||isNaN(x)||!isFinite(x))return "&ndash;";return (x*100).toFixed(1)+"%";};
const fmtNP=x=>{if(x==null||isNaN(x))return "";const n=Math.round(x);return (n<0?"-":"")+"\u20B9"+Math.abs(n).toLocaleString("en-IN");};
const mean=a=>a.length?a.reduce((s,v)=>s+(v||0),0)/a.length:0;
const cls=x=>x>0?"pos":x<0?"neg":"";
let charts={};
const acctKind=n=>{const a=S.accounts.find(a=>a.name===n);return a?a.kind:"";};
const isCash=n=>{const k=acctKind(n);return k==="Bank"||k==="Cash";};
const catInfo=n=>S.cats.find(c=>c.name===n)||{};
function txnType(x){if(x.type)return x.type;const k=KINDS[x.kind];return k?k.t:"Expense";}
function txnCF(x){if(x.cf)return x.cf;const k=KINDS[x.kind];return k?k.cf:"Operating";}
function txnEss(x){if(x.ess)return x.ess;return catInfo(x.cat).essdisc||"";}
function txnInc(x){if(x.inc)return x.inc;return catInfo(x.cat).incclass||"";}
const p2=n=>String(n).padStart(2,"0");
const toYMD=v=>{if(v==null||v==="")return"";if(typeof v==="number"&&isFinite(v)){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate());}if(v instanceof Date){const d=new Date(v.getTime()+43200000);return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate());}const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=new Date(s);if(!isNaN(d)){const d2=new Date(d.getTime()+43200000);return d2.getUTCFullYear()+"-"+p2(d2.getUTCMonth()+1)+"-"+p2(d2.getUTCDate());}return s.slice(0,10);};
const dstr=d=>{if(d==null||d==="")return"";if(typeof d==="string"){const s=d.trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);}return toYMD(d);};
const ym=d=>{const s=dstr(d);return s?s.slice(0,7):"";};

/* ===== IMPORT ===== */
$("#btnImport").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async ev=>{try{await importWB(ev.target.result);toast("Imported "+S.txns.length+" transactions");persist();ovSel="All";render();}
    catch(err){console.error(err);toast("Could not read that file \u2014 is it the finance workbook?");}};
  rd.readAsArrayBuffer(f);};
function sheetRows(wb,frag){const nm=wb.SheetNames.find(n=>n.toLowerCase().includes(frag));if(!nm)return null;return XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:null});}
function headerIdx(rows,tests){for(let i=0;i<Math.min(rows.length,200);i++){const r=(rows[i]||[]).map(c=>String(c||"").trim().toLowerCase());if(tests.every(t=>r.some(c=>c.length<=30&&c.includes(t))))return i;}return -1;}
function colMap(row){const m={};(row||[]).forEach((c,i)=>{const k=String(c||"").trim().toLowerCase();if(!(k in m))m[k]=i;});return m;}
function pick(m,...names){for(const n of names){for(const k in m){if(k.includes(n))return m[k];}}return -1;}
const clean=v=>{const s=String(v==null?"":v).trim();return (s==="None"||s==="none")?"":s;};
const cleanName=v=>{const s=clean(v);return (s.includes("#VALUE")||s.includes("#REF")||s.includes("#N/A"))?"":s;};
const norm=v=>{const s=clean(v);return (s==="0")?"":s;};
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
// Minimal native unzip (no external lib) using DecompressionStream.
async function unzipParts(buf,want){
  const u8=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder(),res={};
  let eo=-1;for(let i=u8.length-22;i>=0&&i>u8.length-65558;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0)return res;
  const nEnt=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);
  for(let e=0;e<nEnt&&p+46<=u8.length;e++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),compSize=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),commentLen=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nameLen));p+=46+nameLen+extraLen+commentLen;
    if(!want(name))continue;
    if(dv.getUint32(lho,true)!==0x04034b50)continue;
    const lnl=dv.getUint16(lho+26,true),lel=dv.getUint16(lho+28,true),start=lho+30+lnl+lel;
    const comp=u8.subarray(start,start+compSize);let ob;
    if(method===0)ob=comp;
    else if(method===8){const s=new DecompressionStream("deflate-raw");const w=s.writable.getWriter();w.write(comp);w.close();ob=new Uint8Array(await new Response(s.readable).arrayBuffer());}
    else continue;
    res[name]=dec.decode(ob);
  }
  return res;
}
// Read defined names, subcategory lists, and Stock-data-type display names straight from the xlsx XML.
async function extractRichNames(buf){
  const out={rich:{},defnames:{},subcats:{}};
  try{
    if(typeof DecompressionStream==="undefined")return out;
    const files=await unzipParts(buf,n=>n==="xl/metadata.xml"||n.startsWith("xl/richData/")||n==="xl/workbook.xml"||n==="xl/_rels/workbook.xml.rels"||n==="xl/sharedStrings.xml"||n.startsWith("xl/worksheets/"));
    const T=n=>files[n]||"";
    const ent=s=>s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&#x?[0-9a-fA-F]+;/g,m=>{try{return String.fromCharCode(m[2]==='x'||m[2]==='X'?parseInt(m.slice(3,-1),16):parseInt(m.slice(2,-1),10));}catch(e){return m;}});
    const relMap={};[...T("xl/_rels/workbook.xml.rels").matchAll(/Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(x=>relMap[x[1]]=x[2]);
    const wbx=T("xl/workbook.xml");
    // ---- defined names (independent of rich data) ----
    [...wbx.matchAll(/<definedName name="([^"]+)"[^>]*>([^<]+)<\/definedName>/g)].forEach(x=>out.defnames[x[1]]=ent(x[2]));
    const sheets=[...wbx.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)].map(x=>[ent(x[1]),x[2]]);
    const resolve=rid=>{let t=relMap[rid];if(!t)return"";t=t.replace(/^\//,"");return t.startsWith("xl/")?t:"xl/"+t;};
    // ---- shared strings ----
    const sst=[...T("xl/sharedStrings.xml").matchAll(/<si>([\s\S]*?)<\/si>/g)].map(si=>ent([...si[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(t=>t[1]).join("")));
    // ---- subcategories: read each defined-name column straight from the Lists sheet cells ----
    const listEntry=sheets.find(([nm])=>nm.toLowerCase().includes("list"));
    if(listEntry){
      const lx=T(resolve(listEntry[1]));
      const cellVal={};
      [...lx.matchAll(/<c r="([A-Z]+\d+)"([^>]*)>\s*<v>([\s\S]*?)<\/v>\s*<\/c>/g)].forEach(mm=>{const addr=mm[1],attrs=mm[2],v=mm[3];cellVal[addr]=/t="s"/.test(attrs)?(sst[+v]||""):ent(v);});
      Object.entries(out.defnames).forEach(([nm,ref])=>{if(!/Lists/.test(ref))return;const rng=ref.replace(/\$/g,"").split("!").pop();const m2=rng.match(/([A-Z]+)(\d+)/);if(!m2)return;const col=m2[1],r0=+m2[2];const vals=[];for(let k=0;k<300;k++){const val=cellVal[col+(r0+k)];if(val==null||String(val).trim()==="")break;vals.push(String(val).trim());}if(vals.length)out.subcats[nm]=vals;});
    }
    // ---- Stock data-type display names (rich data; may be absent) ----
    const md=T("xl/metadata.xml");if(!md)return out;
    const vmMap=[...(md.split("<valueMetadata")[1]||"").matchAll(/<bk>[\s\S]*?<rc t="(\d+)" v="(\d+)"[\s\S]*?<\/bk>/g)].map(x=>[+x[1],+x[2]]);
    const rvb=[...md.matchAll(/rvb i="(\d+)"/g)].map(x=>+x[1]);
    const structs=[...T("xl/richData/rdrichvaluestructure.xml").matchAll(/<s (?:t="[^"]*")?>([\s\S]*?)<\/s>/g)].map(x=>[...x[1].matchAll(/<k n="([^"]+)"/g)].map(k=>k[1]));
    const rvs=[...T("xl/richData/rdrichvalue.xml").matchAll(/<rv s="(\d+)">([\s\S]*?)<\/rv>/g)].map(x=>[+x[1],[...x[2].matchAll(/<v>([\s\S]*?)<\/v>/g)].map(v=>v[1])]);
    if(!rvs.length)return out;
    const rvDict=i=>{const[s,vals]=rvs[i];const keys=structs[s]||[];const d={};keys.forEach((k,j)=>d[k]=vals[j]);return d;};
    const nameFor=(i,dep)=>{if(dep>4||i<0||i>=rvs.length)return "";const d=rvDict(i);if("%cvi" in d)return nameFor(+d["%cvi"],dep+1);return d["Name"]||d["_DisplayString"]||"";};
    sheets.forEach(([nm,rid])=>{
      const sx=T(resolve(rid));if(!sx)return;const map={};
      [...sx.matchAll(/<c r="[A-Z]+(\d+)"[^>]*vm="(\d+)"/g)].forEach(x=>{const row=+x[1],vm=+x[2],ee=vmMap[vm-1];if(!ee)return;const fi=ee[1];if(fi>=rvb.length)return;const name=ent(nameFor(rvb[fi],0));if(name)map[row]=name;});
      out.rich[nm]=map;
    });
  }catch(e){console.warn("xlsx extras parse skipped:",e);}
  return out;
}
async function importWB(buf){
  const wb=XLSX.read(new Uint8Array(buf),{type:"array"});
  const extras=await extractRichNames(buf);
  const rich=extras.rich||{}, defnames=extras.defnames||{};
  const lists=sheetRows(wb,"list");
  if(lists){
    const ah=headerIdx(lists,["account","opening"]);
    if(ah>=0){const m=colMap(lists[ah]);const ci={name:pick(m,"account"),kind:pick(m,"kind"),open:pick(m,"opening")};
      const acc=[];for(let i=ah+1;i<lists.length;i++){const r=lists[i]||[];const nm=r[ci.name];if(nm==null||String(nm).trim()==="")break;
        acc.push({name:String(nm).trim(),kind:String(r[ci.kind]||"").trim(),open:+r[ci.open]||0});}
      if(acc.length)S.accounts=acc;}
    const ch=headerIdx(lists,["category","applies"]);
    if(ch>=0){const m=colMap(lists[ch]);const ci={name:pick(m,"category"),ap:pick(m,"applies"),fv:pick(m,"fixed"),ed:pick(m,"essential"),ic:pick(m,"income")};
      const cats=[];for(let i=ch+1;i<lists.length;i++){const r=lists[i]||[];const nm=r[ci.name];if(nm==null||String(nm).trim()==="")break;
        cats.push({name:String(nm).trim(),applies:clean(r[ci.ap]),fixvar:norm(r[ci.fv]),essdisc:norm(r[ci.ed]),incclass:norm(r[ci.ic])});}
      if(cats.length)S.cats=cats;}
    // subcategories: prefer XML-parsed values; fall back to reading defined-name ranges via SheetJS directly
    const sub={};
    try{
      const wsL=wb.Sheets[wb.SheetNames.find(n=>n.toLowerCase().includes("list"))];
      const nref={};const wbn=(wb.Workbook&&wb.Workbook.Names)||[];wbn.forEach(n=>{if(n&&n.Name)nref[n.Name]=n.Ref;});
      Object.keys(extras.defnames||{}).forEach(k=>{if(!nref[k])nref[k]=extras.defnames[k];});
      (S.cats||[]).forEach(c=>{const key=c.name.replace(/ /g,"_");
        let vals=(extras.subcats&&(extras.subcats[key]||extras.subcats[c.name]))||[];
        if(!vals.length&&wsL){const ref=nref[key]||nref[c.name];if(ref&&/Lists/.test(String(ref)))vals=readNamedCol(wsL,ref);}
        if(vals.length)sub[c.name]=vals;});
    }catch(e){console.warn("subcat parse:",e);}
    S.subcats=sub;
  }
  // budget tab: category -> monthly budget
  const bud=sheetRows(wb,"budget");
  if(bud){const bh=headerIdx(bud,["category","monthly"]);
    if(bh>=0){const bm=colMap(bud[bh]);const bc={cat:pick(bm,"category"),mo:pick(bm,"monthly"),ed:pick(bm,"essential"),fv:pick(bm,"fixed")};
      const arr=[];for(let i=bh+1;i<bud.length;i++){const r=bud[i]||[];const nm=r[bc.cat];if(nm==null||String(nm).trim()===""||String(nm).trim().toUpperCase()==="TOTAL")break;
        arr.push({cat:String(nm).trim(),monthly:+r[bc.mo]||0,essdisc:clean(r[bc.ed]),fixvar:clean(r[bc.fv])});}
      if(arr.length)S.budget=arr;}}
  const tr=sheetRows(wb,"transaction");const th=headerIdx(tr,["from","to","amount"]);const m=colMap(tr[th]);
  const ci={date:pick(m,"date"),kind:pick(m,"txn kind","kind"),type:pick(m,"type"),from:pick(m,"from"),to:pick(m,"to"),amt:pick(m,"amount"),cat:pick(m,"category"),sub:pick(m,"sub"),card:pick(m,"card"),grp:pick(m,"group"),com:pick(m,"comment"),cf:pick(m,"cf"),ess:pick(m,"ess"),inc:pick(m,"inc")};
  const txns=[];
  for(let i=th+1;i<tr.length;i++){const r=tr[i]||[];const kind=r[ci.kind],amt=r[ci.amt];
    if((kind==null||kind==="")&&(amt==null||amt===""))continue;
    txns.push({date:toYMD(r[ci.date]),kind:String(kind||"").trim(),type:clean(r[ci.type]),from:String(r[ci.from]||"").trim(),to:String(r[ci.to]||"").trim(),amt:+amt||0,cat:clean(r[ci.cat]),sub:clean(r[ci.sub]),card:clean(r[ci.card]),grp:clean(r[ci.grp]),com:clean(r[ci.com]),cf:clean(r[ci.cf]),ess:norm(r[ci.ess]),inc:norm(r[ci.inc])});}
  S.txns=txns;
  const iv=sheetRows(wb,"invest");const ih=headerIdx(iv,["asset class","linked"]);
  const invName=wb.SheetNames.find(n=>n.toLowerCase().includes("invest"));
  const invRich=(rich&&invName&&rich[invName])||{};
  if(ih>=0){const im=colMap(iv[ih]);
    const ic={cl:pick(im,"asset class"),ty:pick(im,"instrument"),nm:pick(im,"name"),ac:pick(im,"linked"),u:pick(im,"units"),av:pick(im,"avg cost"),cp:pick(im,"cur price","current price"),mi:pick(im,"invested (if"),mv:pick(im,"value (if")};
    const hs=[];
    for(let i=ih+1;i<iv.length;i++){const r=iv[i]||[];const clS=String(r[ic.cl]||"").trim();
      if(!["Equity","Debt","Gold","Cash","Other"].includes(clS))continue;
      const u=num(r[ic.u]),av=num(r[ic.av]),pr=num(r[ic.cp]),mi=num(r[ic.mi]),mv=num(r[ic.mv]);
      const inv=(u!=null&&av!=null)?u*av:(mi||0);
      const cur=(u!=null&&pr!=null)?u*pr:(mv!=null?mv:inv);
      // skip empty / junk rows (no value, no units) and near-zero artifacts
      if((u==null||u===0)&&Math.abs(inv)<1&&Math.abs(cur)<1)continue;
      const nm=invRich[i+1]||cleanName(r[ic.nm]);  // i+1 = Excel row; rich-data name wins over #VALUE
      hs.push({cls:clS,type:clean(r[ic.ty]),name:nm,acct:clean(r[ic.ac]),units:u,avg:av,price:pr,minv:mi,mval:mv});}
    S.holdings=hs;
  }
  S.loaded=true;
}

/* ===== COMPUTE ===== */
function compute(){
  const inn={},outn={};S.accounts.forEach(a=>{inn[a.name]=0;outn[a.name]=0;});
  S.txns.forEach(x=>{if(x.to in inn)inn[x.to]+=x.amt;if(x.from in outn)outn[x.from]+=x.amt;});
  const bal={};S.accounts.forEach(a=>{bal[a.name]=a.open+inn[a.name]-outn[a.name];});
  const byKind=k=>S.accounts.filter(a=>a.kind===k).reduce((s,a)=>s+bal[a.name],0);
  // investments: securities (skip Cash class, they are broker cash / computed as plug)
  const invAccts=S.accounts.filter(a=>a.kind==="Investment").map(a=>a.name);
  const secByAcct={};invAccts.forEach(b=>secByAcct[b]=0);
  const holds=[];
  S.holdings.forEach((h,idx)=>{
    if(h.cls==="Cash")return; // broker cash handled as plug
    const inv=(h.units!=null&&h.avg!=null)?h.units*h.avg:(h.minv||0);
    const cur=(h.units!=null&&h.price!=null)?h.units*h.price:(h.mval!=null?h.mval:inv);
    const o={...h,invested:inv,current:cur,plug:false,_i:idx};
    holds.push(o);
    if(h.acct&&secByAcct[h.acct]!=null)secByAcct[h.acct]+=inv;
  });
  invAccts.forEach(b=>{const plug=bal[b]-(secByAcct[b]||0);
    if(Math.abs(plug)>=1)holds.push({cls:"Cash",type:"Broker Cash",name:b+" uninvested cash",acct:b,units:null,invested:plug,current:plug,plug:true});});
  const portInv=holds.reduce((s,h)=>s+h.invested,0),portCur=holds.reduce((s,h)=>s+h.current,0);
  const bank=byKind("Bank"),cash=byKind("Cash"),recv=byKind("Receivable"),clr=byKind("Clearing"),dep=byKind("Deposit");
  const cc=-byKind("Credit Card"),loan=-byKind("Loan");
  const curAssets=bank+cash+recv+clr,totAssets=curAssets+portCur+dep,totLiab=cc+loan,netWorth=totAssets-totLiab;
  const months=[...new Set(S.txns.map(x=>ym(x.date)).filter(Boolean))].sort();
  const sumM=pred=>{const o={};months.forEach(mn=>o[mn]=0);let t=0;S.txns.forEach(x=>{if(pred(x)){const mn=ym(x.date);if(o[mn]!=null)o[mn]+=x.amt;t+=x.amt;}});o._t=t;return o;};
  const IS={months};
  IS.rec=sumM(x=>txnType(x)==="Income"&&txnInc(x)==="Recurring");
  IS.win=sumM(x=>txnType(x)==="Income"&&txnInc(x)==="Windfall");
  IS.rev=sumM(x=>txnType(x)==="Income");
  IS.ess=sumM(x=>txnType(x)==="Expense"&&txnEss(x)==="Essential");
  IS.disc=sumM(x=>txnType(x)==="Expense"&&txnEss(x)==="Discretionary");
  IS.exp=sumM(x=>txnType(x)==="Expense");
  IS.net={_t:IS.rev._t-IS.exp._t};months.forEach(mn=>IS.net[mn]=IS.rev[mn]-IS.exp[mn]);
  const incCats=S.cats.filter(c=>c.applies==="Income"),expCats=S.cats.filter(c=>c.applies==="Expense");
  IS.incRows=incCats.map(c=>({cat:c.name,grp:c.incclass||"Other",m:sumM(x=>x.cat===c.name&&txnType(x)==="Income")}));
  IS.expRows=expCats.map(c=>({cat:c.name,grp:c.essdisc||"Other",m:sumM(x=>x.cat===c.name&&txnType(x)==="Expense")}));
  // cash flow
  const cfB=b=>S.txns.filter(x=>txnCF(x)===b).reduce((s,x)=>s+((isCash(x.to)?x.amt:0)-(isCash(x.from)?x.amt:0)),0);
  const beginCash=S.accounts.filter(a=>a.kind==="Bank"||a.kind==="Cash").reduce((s,a)=>s+a.open,0);
  const CF={begin:beginCash,op:cfB("Operating"),inv:cfB("Investing"),fin:cfB("Financing"),int:cfB("Internal")};
  CF.net=CF.op+CF.inv+CF.fin+CF.int;CF.end=CF.begin+CF.net;CF.bsCash=bank+cash;CF.chk=CF.end-CF.bsCash;
  const nM=months.length||1,avgMo=IS.exp._t/nM;
  const R={liquid:bank+cash,avgMo,runway:(bank+cash)/(avgMo||1),curRatio:totLiab?curAssets/totLiab:null,
    dNW:netWorth?totLiab/netWorth:null,dInc:IS.rev._t?totLiab/IS.rev._t:null,
    saveCore:IS.rec._t?(IS.rec._t-IS.exp._t)/IS.rec._t:null,saveAll:IS.rev._t?IS.net._t/IS.rev._t:null,
    ret:portInv?(portCur-portInv)/portInv:null,wc:curAssets-totLiab,empRecv:bal["Employer Receivable"]||0,
    reimb:S.txns.filter(x=>x.kind==="Reimbursable Spend (Claim)").reduce((s,x)=>s+x.amt,0)};
  R.dso=R.reimb?(R.empRecv/R.reimb)*365:null;
  return {bal,byKind,holds,bank,cash,recv,clr,dep,cc,loan,curAssets,totAssets,totLiab,netWorth,portInv,portCur,IS,CF,R,months};
}

function render(){renderCapture();if(!S.loaded){renderEmpty();return;}M=compute();renderOverview();renderTxns();renderInvest();renderStatements();renderTrends();renderBudget();renderRatios();}
function renderEmpty(){const box=`<div class="empty"><h2>Import your workbook to begin</h2><p>Load your finance .xlsx and Ledger reads the Transactions, Investments and Lists tabs, then computes every statement, ratio and chart in your browser. Nothing leaves this device.</p><p style="margin-top:18px"><button class="btn p" onclick="document.getElementById('file').click()">&#8615; Import workbook</button></p></div>`;["overview","txns","invest","statements","trends","budget","ratios"].forEach(v=>$("#v-"+v).innerHTML=box);}
function kpi(label,val,note,k=""){return `<div class="card kpi"><div class="label">${label}</div><div class="val ${k}">${val}</div>${note?`<div class="note">${note}</div>`:""}</div>`;}

function periodFlows(sel){const IS=M.IS;const g=o=>sel==="All"?o._t:(o[sel]||0);
  const rec=g(IS.rec),rev=g(IS.rev),exp=g(IS.exp),ess=g(IS.ess),disc=g(IS.disc),net=g(IS.net),win=g(IS.win);
  return {rec,rev,exp,ess,disc,net,win,saveCore:rec?(rec-exp)/rec:null,saveAll:rev?net/rev:null};}
function insights(){
  const IS=M.IS,m=IS.months,curM=ym(new Date()),out=[];
  const comp=m.filter(x=>x!==curM);
  if(comp.length>=2){
    const last=comp[comp.length-1],prior=comp.slice(0,-1);
    const pavg=obj=>mean(prior.map(x=>obj[x]||0));
    const mv=IS.expRows.map(r=>{const a=pavg(r.m),v=r.m[last]||0;return{cat:r.cat,v,a,d:v-a,pct:a?(v-a)/a:(v>0?1:0)};}).filter(x=>x.a>=1000||x.v>=1000);
    mv.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
    mv.slice(0,3).forEach(x=>{if(Math.abs(x.d)>=1000&&Math.abs(x.pct)>=0.15)out.push({t:`<b>${x.cat}</b> ${x.pct>0?"up":"down"} ${Math.abs(Math.round(x.pct*100))}% in ${last} &mdash; ${fmtN(x.v)} vs ${fmtN(x.a)} avg`,tone:x.pct>0?"neg":"pos"});});
    const sr=x=>IS.rec[x]?((IS.rec[x]-IS.exp[x])/IS.rec[x]):null;
    const srL=sr(last),prSr=prior.map(sr).filter(v=>v!=null),srA=mean(prSr);
    if(srL!=null&&prSr.length&&Math.abs(srL-srA)>=0.05)out.push({t:`Core savings rate ${srL>srA?"rose":"fell"} to <b>${(srL*100).toFixed(0)}%</b> in ${last} (avg ${(srA*100).toFixed(0)}%)`,tone:srL>=srA?"pos":"neg"});
    const top=IS.expRows.map(r=>({cat:r.cat,v:r.m[last]||0})).sort((a,b)=>b.v-a.v)[0];
    if(top&&top.v>0)out.push({t:`Biggest spend in ${last}: <b>${top.cat}</b> at ${fmtN(top.v)}`,tone:"neutral"});
    if(S.budget&&S.budget.length){const br=S.budget.map(b=>{const er=IS.expRows.find(r=>r.cat===b.cat);const a=er?(er.m[last]||0):0;return{cat:b.cat,over:a-b.monthly,b:b.monthly,a};}).filter(x=>x.b>0&&x.over>0.1*x.b).sort((a,b)=>b.over-a.over);
      br.slice(0,2).forEach(x=>out.push({t:`Over budget on <b>${x.cat}</b> in ${last} by ${fmtN(x.over)} (${fmtN(x.a)} vs ${fmtN(x.b)} plan)`,tone:"warn"}));}
    if((IS.win[last]||0)>0)out.push({t:`Windfall income of <b>${fmtN(IS.win[last])}</b> landed in ${last}`,tone:"pos"});
  }
  const er=M.bal["Employer Receivable"]||0;if(er>1000)out.push({t:`<b>${fmtN(er)}</b> in reimbursements still owed to you`,tone:"warn"});
  if(M.portInv>0){const g=(M.portCur-M.portInv)/M.portInv;out.push({t:`Portfolio ${g>=0?"up":"down"} <b>${Math.abs(g*100).toFixed(0)}%</b> vs cost &mdash; ${fmtN(M.portCur-M.portInv)} unrealised`,tone:g>=0?"pos":"neg"});}
  if(M.R.runway)out.push({t:`Emergency runway: <b>${M.R.runway.toFixed(1)} months</b> covered by liquid assets`,tone:M.R.runway>=6?"pos":"warn"});
  return out.slice(0,7);
}
function insightsHTML(){const arr=insights();if(!arr.length)return `<div class="muted">Import a couple of months of data and insights on spending shifts, savings and budgets will appear here.</div>`;
  const col={pos:"var(--pos)",neg:"var(--neg)",warn:"var(--warn)",neutral:"var(--ink3)"};
  return `<div style="display:flex;flex-direction:column;gap:9px">${arr.map(i=>`<div style="display:flex;gap:10px;align-items:baseline"><span style="flex:0 0 7px;width:7px;height:7px;border-radius:2px;background:${col[i.tone]||col.neutral};transform:translateY(-1px)"></span><span>${i.t}</span></div>`).join("")}</div>`;}

function topCats(sel){const g=o=>sel==="All"?o._t:(o[sel]||0);
  const rows=M.IS.expRows.map(r=>({cat:r.cat,v:g(r.m)})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,7);

  return `<table><tbody>${rows.map(r=>`<tr><td>${r.cat}</td><td style="width:45%"><div class="bar"><i style="width:${Math.max(3,100*r.v/max)}%"></i></div></td><td class="n">${fmtN(r.v)}</td></tr>`).join("")}</tbody></table>`;}
function signals(){const R=M.R,s=[];
  s.push(["Emergency runway",R.runway?R.runway.toFixed(1)+" months":"&ndash;",R.runway>=6?"pos":"warn"]);

function loadEdit(i){editIx=i;renderTxns();$("#nav button[data-v=txns]").click();window.scrollTo(0,0);}
function formTxn(){return{date:$("#f_date").value,kind:$("#f_kind").value,from:$("#f_from").value,to:$("#f_to").value,amt:+$("#f_amt").value||0,cat:$("#f_cat").value,sub:$("#f_sub").value,com:$("#f_com").value,card:"",grp:""};}
function checkTxn(x){const t=txnType(x),k=KINDS[x.kind]||{};
  if(x.amt<=0)return{ok:false,msg:"Amount must be > 0"};
  if(x.from===x.to)return{ok:false,msg:"From = To not allowed"};
  if(t==="Expense"&&x.to!==EXT)return{ok:false,msg:"Expense must go To External"};
  if(t==="Expense"&&x.from===EXT)return{ok:false,msg:"Expense From cannot be External"};
  if(t==="Income"&&x.from!==EXT)return{ok:false,msg:"Income must come From External"};
  if(t==="Income"&&x.to===EXT)return{ok:false,msg:"Income To cannot be External"};
  if(t==="Transfer"&&(x.from===EXT||x.to===EXT))return{ok:false,msg:"Transfer cannot touch External"};
  if(k.cr&&!x.cat)return{ok:false,msg:"Category required for this kind"};
  return{ok:true};}

/* ===================================================================================
   QUICK ADD — mobile capture, local queue, and direct-to-workbook merge.
   Lives in the same file/localStorage as the rest of the app (per design), but is a
   deliberately simpler, thumb-friendly screen rather than a squeeze of the dense views.
   Entries queue separately from S.txns (which mirrors your last *import*) until you
   merge them into the actual .xlsx — merging writes straight into the pre-formatted
   blank buffer rows already set up in Transactions, entirely in this browser tab.
   =================================================================================== */
const CAP_K_QUEUE="cap_queue_v1",CAP_K_ARCH="cap_archives_v1",CAP_K_META="cap_meta_v1";
const capLoad=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const capSave=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let CAP_QUEUE=capLoad(CAP_K_QUEUE,[]);
let CAP_ARCH=capLoad(CAP_K_ARCH,{});
let CAP_META=capLoad(CAP_K_META,{});
const capPersistQueue=()=>capSave(CAP_K_QUEUE,CAP_QUEUE);
const capPersistArch=()=>capSave(CAP_K_ARCH,CAP_ARCH);
const capPersistMeta=()=>capSave(CAP_K_META,CAP_META);
let capEditId=null,capTab="add",capMergeFile=null;

function capUid(){return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function capToday(){return new Date().toISOString().slice(0,10);}
function capFmtN(n){const s=Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:2});return (n<0?"\u2212":"")+"\u20b9"+s;}
function capFmtDate(d){const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"});}
function capOpt(arr,sel){return arr.map(v=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(v)}</option>`).join("");}

function switchCapTab(t){capTab=t;renderCapture();}

function renderCapture(){
  const n=CAP_QUEUE.length;
  const tabs=[["add","Add"],["queue","Queue"+(n?" ("+n+")":"")],["merge","Merge"],["data","Data"]];
  const box=`<div class="cap-wrap">
    <div class="switch cap-tabs">${tabs.map(([k,l])=>`<button class="${capTab===k?"on":""}" data-cap="${k}">${l}</button>`).join("")}</div>
    <div id="capBody"></div>
  </div>`;
  $("#v-capture").innerHTML=box;
  $$("#v-capture [data-cap]").forEach(b=>b.onclick=()=>switchCapTab(b.dataset.cap));
  if(capTab==="add")renderCapAdd();
  else if(capTab==="queue")renderCapQueue();
  else if(capTab==="merge")renderCapMerge();
  else renderCapData();
}

/* ---- self-contained zip read/write (native CompressionStream, no library) ---- */
async function capInflateRaw(bytes){const ds=new DecompressionStream("deflate-raw");const s=new Blob([bytes]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer());}
async function capDeflateRaw(bytes){const cs=new CompressionStream("deflate-raw");const s=new Blob([bytes]).stream().pipeThrough(cs);return new Uint8Array(await new Response(s).arrayBuffer());}
const CAP_CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function capCrc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CAP_CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function capDv(buf){return new DataView(buf.buffer,buf.byteOffset,buf.byteLength);}
function capFindEOCD(bytes){
  const sig=0x06054b50,maxBack=Math.min(bytes.length,65535+22);
  for(let i=bytes.length-22;i>=bytes.length-maxBack;i--){if(i<0)break;if(capDv(bytes).getUint32(i,true)===sig)return i;}
  throw new Error("Not a valid zip file (no End Of Central Directory record found).");
}
async function capUnzip(bytes){
  const eocdOff=capFindEOCD(bytes),d=capDv(bytes);
  const cdOffset=d.getUint32(eocdOff+16,true),cdEntries=d.getUint16(eocdOff+10,true);
  const out={};let p=cdOffset;
  for(let i=0;i<cdEntries;i++){
    if(d.getUint32(p,true)!==0x02014b50)throw new Error("Corrupt central directory entry.");
    const method=d.getUint16(p+10,true),compSize=d.getUint32(p+20,true),nameLen=d.getUint16(p+28,true),extraLen=d.getUint16(p+30,true),commentLen=d.getUint16(p+32,true),localOffset=d.getUint32(p+42,true);
    const name=new TextDecoder().decode(bytes.subarray(p+46,p+46+nameLen));
    const lp=localOffset;
    if(d.getUint32(lp,true)!==0x04034b50)throw new Error("Corrupt local file header for "+name);
    const lNameLen=d.getUint16(lp+26,true),lExtraLen=d.getUint16(lp+28,true),dataStart=lp+30+lNameLen+lExtraLen;
    const raw=bytes.subarray(dataStart,dataStart+compSize);
    if(!name.endsWith("/"))out[name]=method===0?new Uint8Array(raw):await capInflateRaw(raw);
    p+=46+nameLen+extraLen+commentLen;
  }
  return out;
}
async function capZip(files){
  const encoder=new TextEncoder(),localParts=[],centralParts=[];let offset=0;
  const now=new Date();
  const dosTime=((now.getHours()&0x1F)<<11)|((now.getMinutes()&0x3F)<<5)|((now.getSeconds()/2)&0x1F);
  const dosDate=(((now.getFullYear()-1980)&0x7F)<<9)|(((now.getMonth()+1)&0xF)<<5)|(now.getDate()&0x1F);
  for(const name of Object.keys(files)){
    const data=files[name],nameBytes=encoder.encode(name),crc=capCrc32(data);
    const compressed=await capDeflateRaw(data);
    const useStore=compressed.length>=data.length;
    const payload=useStore?data:compressed,method=useStore?0:8;
    const lh=new Uint8Array(30+nameBytes.length),lv=capDv(lh);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,method,true);
    lv.setUint16(10,dosTime,true);lv.setUint16(12,dosDate,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,payload.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,nameBytes.length,true);lv.setUint16(28,0,true);
    lh.set(nameBytes,30);
    localParts.push(lh,payload);
    const ch=new Uint8Array(46+nameBytes.length),cv=capDv(ch);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
    cv.setUint16(10,method,true);cv.setUint16(12,dosTime,true);cv.setUint16(14,dosDate,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,payload.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nameBytes.length,true);
    cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint16(38,0,true);cv.setUint32(40,0,true);cv.setUint32(42,offset,true);
    ch.set(nameBytes,46);
    centralParts.push(ch);
    offset+=lh.length+payload.length;
  }
  const centralStart=offset;let centralSize=0;for(const c of centralParts)centralSize+=c.length;
  const eocd=new Uint8Array(22),ev=capDv(eocd);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,Object.keys(files).length,true);ev.setUint16(10,Object.keys(files).length,true);
  ev.setUint32(12,centralSize,true);ev.setUint32(16,centralStart,true);ev.setUint16(20,0,true);
  const total=offset+centralSize+22,outBuf=new Uint8Array(total);let pos=0;
  for(const part of localParts){outBuf.set(part,pos);pos+=part.length;}
  for(const part of centralParts){outBuf.set(part,pos);pos+=part.length;}
  outBuf.set(eocd,pos);
  return outBuf;
}
function capDownload(name,bytes,type){
  const blob=new Blob([bytes],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
}
function capFindSheetPath(zip,sheetName){
  const wbXml=new TextDecoder().decode(zip["xl/workbook.xml"]);
  const relsXml=new TextDecoder().decode(zip["xl/_rels/workbook.xml.rels"]);
  const sm=wbXml.match(new RegExp(`<sheet name="${sheetName.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}" sheetId="\\d+" r:id="(rId\\d+)"`));
  if(!sm)return null;
  const rm=relsXml.match(new RegExp(`<Relationship Id="${sm[1]}"[^>]*Target="([^"]+)"`));
  if(!rm)return null;
  return "xl/"+rm[1];
}
const CAP_FIRST_DATA_ROW=8;
function capFindBlankRows(sheetXml){
  const re=/<c r="G(\d+)" s="\d+"\/>/g,rows=[];let m;
  while((m=re.exec(sheetXml))){const r=parseInt(m[1],10);if(r>=CAP_FIRST_DATA_ROW)rows.push(r);}
  rows.sort((a,b)=>a-b);
  return rows;
}
function capSetNum(xml,col,row,val){
  const re=new RegExp(`<c r="${col}${row}" s="(\\d+)"/>`);const m=xml.match(re);
  if(!m)throw new Error(`Expected a blank cell at ${col}${row} but didn't find one.`);
  return xml.replace(re,`<c r="${col}${row}" s="${m[1]}"><v>${val}</v></c>`);
}
function capSetStr(xml,col,row,val){
  if(!val)return xml;
  const re=new RegExp(`<c r="${col}${row}" s="(\\d+)"/>`);const m=xml.match(re);
  if(!m)throw new Error(`Expected a blank cell at ${col}${row} but didn't find one.`);
  return xml.replace(re,`<c r="${col}${row}" s="${m[1]}" t="inlineStr"><is><t>${esc(val)}</t></is></c>`);
}
function capFillRow(sheetXml,row,x){
  const d=new Date(x.date+"T00:00:00");
  sheetXml=capSetNum(sheetXml,"B",row,d.getDate());
  sheetXml=capSetNum(sheetXml,"C",row,d.getMonth()+1);
  sheetXml=capSetNum(sheetXml,"D",row,d.getFullYear());
  sheetXml=capSetStr(sheetXml,"G",row,x.kind);
  sheetXml=capSetStr(sheetXml,"I",row,x.from);
  sheetXml=capSetStr(sheetXml,"J",row,x.to);
  sheetXml=capSetNum(sheetXml,"K",row,x.amt);
  sheetXml=capSetStr(sheetXml,"L",row,x.cat);
  sheetXml=capSetStr(sheetXml,"M",row,x.sub);
  sheetXml=capSetStr(sheetXml,"P",row,x.com);
  return sheetXml;
}
function capAppendChangeLogRow(clXml,summary){
  const rowNums=[...clXml.matchAll(/<row r="(\d+)"/g)].map(m=>+m[1]);
  const next=(rowNums.length?Math.max(...rowNums):1)+1;
  const stamp=new Date().toLocaleString("en-IN");
  const row=`<row r="${next}"><c r="A${next}" t="inlineStr"><is><t>${esc(stamp)}</t></is></c>`+
             `<c r="B${next}" t="inlineStr"><is><t>${esc(summary)}</t></is></c></row>`;
  return clXml.replace("</sheetData>",row+"</sheetData>");
}

  const n=CAP_QUEUE.length;
  $("#capBody").innerHTML=`<div class="card">
    <div class="small" style="color:var(--ink3);margin-bottom:14px;font-size:12.5px">
      ${n?`${n} ${n===1?"entry":"entries"} queued, ready to merge.`:"Nothing queued right now \u2014 add entries first."}
      This writes straight into your workbook's pre-built blank rows, entirely in this browser. No upload to anyone.
    </div>
    <label class="btn" style="display:block;text-align:center;${n?"":"pointer-events:none;opacity:.5"}">
      Choose Personal_Finance.xlsx<input type="file" id="cm_file" accept=".xlsx" hidden></label>
    <div id="cm_fileName" class="small" style="color:var(--ink3);margin-top:8px;text-align:center;font-size:12.5px"></div>
    <div style="height:12px"></div>
    <button class="btn p" id="cm_go" style="width:100%" disabled>Merge &amp; download updated workbook</button>
  </div><div id="cm_result"></div>`;
  if(!n)return;
  $("#cm_file").onchange=e=>{capMergeFile=e.target.files[0]||null;$("#cm_fileName").textContent=capMergeFile?("Selected: "+capMergeFile.name):"";$("#cm_go").disabled=!capMergeFile;};
  $("#cm_go").onclick=capDoMerge;
}

async function capDoMerge(){
  const resultEl=$("#cm_result");
  resultEl.innerHTML=`<div class="card" style="color:var(--ink3);font-size:12.5px">Working\u2026</div>`;
  try{
    const buf=new Uint8Array(await capMergeFile.arrayBuffer());
    const zip=await capUnzip(buf);
    const txnPath=capFindSheetPath(zip,"Transactions");
    if(!txnPath||!zip[txnPath])throw new Error("Couldn't find a Transactions sheet in this file \u2014 make sure you selected the right workbook.");
    let sheetXml=new TextDecoder().decode(zip[txnPath]);
    const blankRows=capFindBlankRows(sheetXml);
    if(!blankRows.length)throw new Error("No pre-formatted blank rows found. The one-time buffer setup hasn't been done on this copy, or it's run out \u2014 ask Claude to extend it again.");
    const entries=[...CAP_QUEUE].sort((a,b)=>a.date.localeCompare(b.date));
    const toMerge=entries.slice(0,blankRows.length);
    const leftover=entries.slice(blankRows.length);
    toMerge.forEach((x,i)=>{sheetXml=capFillRow(sheetXml,blankRows[i],x);});
    const clPath=capFindSheetPath(zip,"Change Log");
    const stamp=new Date().toISOString().replace(/[:T]/g,"-").slice(0,16);
    const dates=toMerge.length?`${toMerge[0].date} to ${toMerge[toMerge.length-1].date}`:"";
    const summary=`Mobile merge: wrote ${toMerge.length} entr${toMerge.length===1?"y":"ies"} (${dates}) into rows `+
      `${blankRows[0]}-${blankRows[toMerge.length-1]} from Quick Add.`;
    if(clPath&&zip[clPath]){
      zip[clPath]=new TextEncoder().encode(capAppendChangeLogRow(new TextDecoder().decode(zip[clPath]),summary));
    }
    zip[txnPath]=new TextEncoder().encode(sheetXml);
    const outBytes=await capZip(zip);
    const outName=capMergeFile.name.replace(/\.xlsx$/i,"")+`_merged_${stamp}.xlsx`;
    capDownload(outName,outBytes,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    CAP_QUEUE=CAP_QUEUE.filter(q=>!toMerge.some(t=>t.id===q.id));
    capPersistQueue();
    resultEl.innerHTML=`<div class="card">
      <h3>Done</h3>
      <div style="font-size:13px;margin-bottom:8px">Merged <b>${toMerge.length}</b> ${toMerge.length===1?"entry":"entries"} into rows ${blankRows[0]}\u2013${blankRows[toMerge.length-1]}.</div>
      ${leftover.length?`<div style="font-size:13px;color:var(--neg)">Buffer only had room for ${toMerge.length} of ${entries.length} \u2014 ${leftover.length} still queued. Ask Claude to extend the buffer, then merge again.</div>`:""}
      <div style="font-size:12.5px;color:var(--ink3);margin-top:8px">Downloaded <b>${esc(outName)}</b>. Save it over your working copy.</div>
    </div>`;
    toast("Workbook updated");
    renderCapture();
  }catch(err){
    resultEl.innerHTML=`<div class="card"><h3 style="color:var(--neg)">Couldn't merge</h3><div style="font-size:13px">${esc(err.message||String(err))}</div></div>`;
  }
}

/* ===== ALLOCATION VIEW (target mix + path to target) ===== */
function driftChip(d){if(d==null)return `<span class="muted">&ndash;</span>`;
  const tol=(S.plan&&S.plan.tol)||2,on=Math.abs(d)<=tol;
  const col=on?"var(--pos)":(Math.abs(d)>2*tol?"var(--neg)":"var(--warn)");
  const arrow=Math.abs(d)<0.05?"":(d>0?"\u25B2":"\u25BC");
  const txt=on?"on target":(Math.abs(d).toFixed(1)+"pp "+(d>0?"over":"under"));
  return `<span style="color:${col};font-weight:600">${arrow} ${txt}</span>`;}
function okbox(h){return `<div style="padding:11px 13px;border:1px solid color-mix(in srgb,var(--pos) 45%,transparent);background:color-mix(in srgb,var(--pos) 10%,transparent);border-radius:10px;font-size:13px;line-height:1.45">${h}</div>`;}
function warnbox(h){return `<div style="padding:11px 13px;border:1px solid color-mix(in srgb,var(--warn) 48%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:10px;font-size:13px;line-height:1.45">${h}</div>`;}
function renderAlloc(){
  const wrap=$("#allocWrap");if(!wrap)return;

  if(S.plan.months==null)S.plan.months=36;if(S.plan.tol==null)S.plan.tol=2;
  if(S.plan._v!==2){S.plan.tol=2;S.plan._v=2;}                 // one-time: adopt the 2pp default
  S.plan.contrib.Cash=cashAuto().cash;                          // Cash always = salary - what you invest elsewhere
  const cur=curMixVals(),cp=pctOf(cur),tgt=S.targetMix;

  // ---- LEFT: target mix & drift ----

    return `<tr><td><span class="chip ${chipCls(c)}">${c}</span></td>

      <td class="n" id="cur-${c}">${cp._tot?cp[c].toFixed(1)+"%":"&ndash;"}</td>

  const sumNote=tSum===100?`<span class="muted">Targets sum to 100%.</span>`:`<span style="color:var(--warn);font-weight:600">Targets sum to ${tSum}%</span> <span class="muted">&mdash; set them to 100% for a clean read.</span>`;
  const targetCard=`<div class="card">
    <h3>Target mix &amp; drift</h3>

    <table><thead><tr><th>Class</th><th class="n">Target</th><th class="n">Current</th><th class="n">Drift</th></tr></thead><tbody>${tRows}</tbody></table>

  // ---- RIGHT: path-to-target plan inputs (Cash row is auto: salary - the rest) ----

    const auto=c==="Cash";
    const cInput=auto
      ? `<input class="mono" id="cashAutoCell" type="number" value="${Math.round(S.plan.contrib.Cash||0)}" readonly title="Auto: salary + bonus &minus; monthly spend &minus; what you invest elsewhere" style="width:112px;text-align:right;opacity:.75;cursor:not-allowed">`
      : `<input class="mono plc" data-c="${c}" type="number" step="500" value="${S.plan.contrib[c]||0}" style="width:112px;text-align:right">`;
    return `<tr><td><span class="chip ${chipCls(c)}">${c}</span>${auto?' <span class="muted" style="font-size:10px">auto</span>':''}</td>
      <td class="n">${cInput}</td>
      <td class="n"><input class="mono plg" data-c="${c}" type="number" step="0.5" value="${S.plan.growth[c]||0}" style="width:70px;text-align:right"></td></tr>`;}).join("");
  const {sal,exp}=cashAuto();
  const salTxt=sal>0?`&#8377;${Math.round(sal).toLocaleString("en-IN")}`:"salary + bonus";
  const expTxt=exp>0?`&#8377;${Math.round(exp).toLocaleString("en-IN")}`:"average spend";
  const planCard=`<div class="card">
    <h3>Path to target &middot; plan</h3>

    <table><thead><tr><th>Class</th><th class="n">Monthly &#8377;</th><th class="n">Growth %/yr</th></tr></thead><tbody>${pRows}</tbody></table>
    <div class="note" style="margin-top:10px"><span class="muted">Cash auto = take-home ${salTxt} (salary + bonus, not RSU) &minus; monthly spend ${expTxt} &minus; what you invest above. Negative = drawing down reserves.</span></div></div>`;
  // ---- BOTTOM: chart (with the horizon/tolerance controls that drive it), then the now/projected/target bars ----
  const controls=`<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
      <label style="text-transform:none;font-size:12px;display:flex;flex-direction:column;gap:7px;color:var(--ink2)">Horizon &middot; <b id="planMonthsLbl" style="color:var(--ink)">${S.plan.months} month${S.plan.months>1?"s":""}</b>
        <input type="range" id="planMonths" min="1" max="120" step="1" value="${S.plan.months}"></label>

        <input class="mono" id="planTol" type="number" min="1" max="25" step="1" value="${S.plan.tol}" style="width:70px"></label>
    </div>`;
  wrap.innerHTML=`<div class="grid g2" style="gap:15px;align-items:start">${targetCard}${planCard}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:14px">
        <h3 style="margin:0">Projected share of each class</h3>${controls}</div>
      <div id="planVerdict" style="margin-bottom:12px"></div><div class="cx" id="planChart"></div></div>
    <div class="card"><h3>Now vs projected vs target</h3><div id="planBars"></div></div>`;
  $$(".tgtIn").forEach(inp=>inp.onchange=()=>{const v=Math.max(0,Math.min(100,Math.round(+inp.value||0)));inp.value=v;S.targetMix[inp.dataset.c]=v;persist();renderAlloc();});
  $$(".plc").forEach(inp=>inp.onchange=()=>{S.plan.contrib[inp.dataset.c]=Math.round(+inp.value||0);inp.value=S.plan.contrib[inp.dataset.c];
    S.plan.contrib.Cash=cashAuto().cash;const cc=$("#cashAutoCell");if(cc)cc.value=Math.round(S.plan.contrib.Cash||0);persist();refreshViz();});
  $$(".plg").forEach(inp=>inp.onchange=()=>{S.plan.growth[inp.dataset.c]=+inp.value||0;persist();refreshViz();});
  $("#planMonths").oninput=e=>{S.plan.months=+e.target.value;$("#planMonthsLbl").innerHTML=S.plan.months+" month"+(S.plan.months>1?"s":"");refreshViz();};
  $("#planMonths").onchange=()=>persist();
  $("#planTol").onchange=e=>{S.plan.tol=Math.max(1,Math.min(25,Math.round(+e.target.value||2)));e.target.value=S.plan.tol;persist();renderAlloc();};
  refreshViz();
}
function refreshViz(){
  if(!$("#planChart"))return;
  S.plan.contrib.Cash=cashAuto().cash;
  const cur=curMixVals(),tgt=S.targetMix||defaultTargets(),tol=(S.plan&&S.plan.tol)||2,months=(S.plan&&S.plan.months)||36;
  const rows=projectMix(cur,S.plan.contrib,S.plan.growth,months),hit=firstConverge(rows,tgt,tol);
  const series=CLS_ORDER.filter(c=>rows.some(r=>r.vals[c]>0)||(tgt[c]||0)>0||(S.plan.contrib[c]||0)!==0).map(c=>({cls:c,color:clsColor(c),data:rows.map(r=>r.pct[c])}));
  drawCx("planChart",w=>projChart(w,months,series,tgt,tol,hit));
  const endRow=rows[rows.length-1],endVals=endRow.vals,tgtVals={};CLS_ORDER.forEach(c=>tgtVals[c]=tgt[c]||0);
  const bars=$("#planBars");if(bars)bars.innerHTML=`<div class="grid g2" style="gap:14px 22px">
     <div><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Now</div>${miniStack(cur)}</div>
     <div><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Projected &middot; +${months}mo</div>${miniStack(endVals)}</div>
     <div><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Target</div>${miniStack(tgtVals)}</div>
     <div class="legend" style="align-items:center">${CLS_ORDER.map(c=>`<span><b style="background:${clsColor(c)}"></b>${c}</span>`).join("")}</div></div>`;
  const tot0=CLS_ORDER.reduce((s,c)=>s+(cur[c]||0),0),anyContrib=CLS_ORDER.some(c=>(S.plan.contrib[c]||0)!==0);
  let vhtml;
  if(tot0<1&&!anyContrib)vhtml=warnbox("Add a holding or a monthly contribution to project a path.");
  else if(hit===0)vhtml=okbox(`You're already within &plusmn;${tol}pp of your target mix.`);
  else if(hit>0)vhtml=okbox(`At this plan, your mix reaches within &plusmn;${tol}pp of target in about <b>${hit} month${hit>1?"s":""}</b> &mdash; around <b>${addMonths(hit)}</b>.`);
  else{const wg=worstGap(endRow,tgt);vhtml=warnbox(`This plan doesn't reach &plusmn;${tol}pp of target within ${months} month${months>1?"s":""}. Largest remaining gap: <b>${wg.cls}</b> ${Math.abs(wg.gap).toFixed(1)}pp ${wg.gap>0?"over":"under"}. Add more to the lagging classes, sell down the over-weight ones, or lengthen the horizon.`);}
  const v=$("#planVerdict");if(v)v.innerHTML=vhtml;
}
