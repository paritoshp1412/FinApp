/* ===== CHARTS ===== */
function fmtC(x){if(x==null||isNaN(x))return"";const n=Math.abs(x);let s;
  if(n>=1e7)s=(x/1e7).toFixed(n>=1e8?0:1)+"Cr";else if(n>=1e5)s=(x/1e5).toFixed(n>=1e6?0:1)+"L";
  else if(n>=1e3)s=(x/1e3).toFixed(0)+"k";else s=String(Math.round(x));return s;}
const _MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function moLbl(y){const p=String(y).split("-");return _MON[(+p[1]||1)-1]||y;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function _rgb(c){try{const el=document.createElement("span");el.style.color=c;el.style.display="none";document.body.appendChild(el);const mm=getComputedStyle(el).color.match(/\d+/g);el.remove();return mm?mm.map(Number):[128,128,128];}catch(e){return[128,128,128];}}
function idealText(c){const a=_rgb(c);return (0.299*a[0]+0.587*a[1]+0.114*a[2])>150?"#0b0d12":"#ffffff";}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}
function chipCls(n){return ({Equity:"t-eq",Debt:"t-debt",Gold:"t-gold",Cash:"t-cash",Other:"t-other",Essential:"t-ess",Discretionary:"t-disc"})[n]||"";}
function clsColor(c){return ({Equity:"var(--t-eq)",Debt:"var(--t-debt)",Gold:"var(--t-gold)",Cash:"var(--t-cash)",Other:"var(--t-other)"})[c]||"var(--t-other)";}
function drawCx(id,fn){const el=$("#"+id);if(!el)return;const w=Math.max(280,Math.round(el.clientWidth||(el.parentNode&&el.parentNode.clientWidth)||520));el.innerHTML=fn(w);}

/* grouped columns, direct value labels */
function groupedBars(w,months,series){
  const h=250,m={t:26,r:14,b:26,l:12},pw=w-m.l-m.r,ph=h-m.t-m.b;
  const all=[];series.forEach(s=>s.data.forEach(v=>{if(v!=null)all.push(v);}));
  const max=niceMax(Math.max(1,...all)),y0=m.t+ph,n=months.length||1,gw=pw/n;
  const bw=Math.min(24,gw/(series.length+.7)),gap=Math.min(5,bw*.2),tw=series.length*bw+(series.length-1)*gap;
  let s=`<line x1="${m.l}" y1="${y0}" x2="${(m.l+pw).toFixed(1)}" y2="${y0}" style="stroke:var(--line2)" stroke-width="1"/>`;
  months.forEach((mm,g)=>{const cx=m.l+gw*(g+.5);
    series.forEach((se,i)=>{const v=se.data[g]||0,bh=Math.max(0,v/max*ph),x=cx-tw/2+i*(bw+gap),y=y0-bh;
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${se.color}"/>`;
      if(v>0&&bw>=11)s+=`<text class="cx-v" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" style="fill:${se.color}">${fmtC(v)}</text>`;});
    s+=`<text class="cx-x" x="${cx.toFixed(1)}" y="${(y0+15).toFixed(1)}">${moLbl(mm)}</text>`;});
  let lx=m.l;let leg='';series.forEach(se=>{leg+=`<rect x="${lx.toFixed(1)}" y="5" width="9" height="9" rx="2" style="fill:${se.color}"/><text class="cx-lg" x="${(lx+13).toFixed(1)}" y="13">${esc(se.name)}</text>`;lx+=13+se.name.length*6.6+18;});
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${leg}${s}</svg>`;}

/* single column series + average rule */
function columnAvg(w,months,data,avg,color,h){
  h=h||250;const m={t:24,r:54,b:26,l:12},pw=w-m.l-m.r,ph=h-m.t-m.b;
  const max=niceMax(Math.max(1,...data.filter(v=>v!=null),avg||0)),y0=m.t+ph,n=months.length||1,gw=pw/n,bw=Math.min(30,gw*.56);
  let s=`<line x1="${m.l}" y1="${y0}" x2="${(m.l+pw).toFixed(1)}" y2="${y0}" style="stroke:var(--line2)" stroke-width="1"/>`;
  months.forEach((mm,g)=>{const v=data[g]||0,cx=m.l+gw*(g+.5),bh=Math.max(0,v/max*ph),x=cx-bw/2,y=y0-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${color}"/>`;
    if(v>0)s+=`<text class="cx-v" x="${cx.toFixed(1)}" y="${(y-5).toFixed(1)}" style="fill:var(--ink2)">${fmtC(v)}</text>`;
    s+=`<text class="cx-x" x="${cx.toFixed(1)}" y="${(y0+15).toFixed(1)}">${moLbl(mm)}</text>`;});
  if(avg!=null&&avg>0){const ay=y0-avg/max*ph;
    s+=`<line x1="${m.l}" y1="${ay.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${ay.toFixed(1)}" style="stroke:var(--rule)" stroke-width="1.4" stroke-dasharray="6 4"/>`;
    s+=`<text class="cx-end" x="${(m.l+pw+6).toFixed(1)}" y="${(ay+3.5).toFixed(1)}" style="fill:var(--rule)">avg ${fmtC(avg)}</text>`;}
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`;}

/* smooth Catmull-Rom spline through points -> cubic bezier path */
function spline(pts){if(!pts.length)return"";if(pts.length<3)return"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
  let d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}
  return d;}
/* multi-line, smooth, end labels + average rules */
function multiLine(w,xs,series,opt){opt=opt||{};const h=opt.h||250,m={t:22,r:70,b:26,l:14},pw=w-m.l-m.r,ph=h-m.t-m.b;
  const vals=[];series.forEach(s=>s.data.forEach(v=>{if(v!=null)vals.push(v);}));(opt.avg||[]).forEach(a=>{if(a.v!=null)vals.push(a.v);});
  let lo=Math.min(...vals,0),hi=Math.max(...vals,1);if(lo===hi)hi=lo+1;const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const X=i=>m.l+(xs.length<=1?pw/2:pw*i/(xs.length-1)),Y=v=>m.t+ph-(v-lo)/(hi-lo)*ph;
  let s=`<line x1="${m.l}" y1="${(m.t+ph).toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${(m.t+ph).toFixed(1)}" style="stroke:var(--line2)" stroke-width="1"/>`;
  (opt.avg||[]).forEach(a=>{if(a.v==null)return;const y=Y(a.v);
    s+=`<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${a.color}" stroke-width="1.1" stroke-dasharray="5 4" opacity=".5"/>`;});
  xs.forEach((xx,i)=>{s+=`<text class="cx-x" x="${X(i).toFixed(1)}" y="${(m.t+ph+15).toFixed(1)}">${moLbl(xx)}</text>`;});
  const ends=[];
  series.forEach(se=>{const runs=[];let cur=[];
    se.data.forEach((v,i)=>{if(v==null){if(cur.length){runs.push(cur);cur=[];}return;}cur.push([X(i),Y(v),v]);});
    if(cur.length)runs.push(cur);
    let d='';runs.forEach(r=>{d+=(opt.smooth?spline(r):("M"+r.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L")))+" ";});
    s+=`<path d="${d}" fill="none" style="stroke:${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const pts=runs.flat();pts.forEach(p=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" style="fill:var(--surface);stroke:${se.color}" stroke-width="1.6"/>`;});
    const last=pts[pts.length-1];if(last){const lab=opt.pct?last[2].toFixed(1)+"%":fmtC(last[2]);ends.push({x:last[0]+8,y:last[1],c:se.color,txt:esc(se.name)+" "+lab});}});
  ends.sort((a,b)=>a.y-b.y);const gp=13;for(let i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<gp)ends[i].y=ends[i-1].y+gp;}
  ends.forEach(e=>{const yy=Math.max(m.t+8,Math.min(h-4,e.y+3.5));s+=`<text class="cx-end" x="${e.x.toFixed(1)}" y="${yy.toFixed(1)}" style="fill:${e.c}">${e.txt}</text>`;});
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`;}

/* horizontal 100% stacked bar + legend */
function stackH(items){items=items.filter(it=>it.value>0);const tot=items.reduce((a,b)=>a+b.value,0)||1;
  let seg='',leg='';
  items.forEach(it=>{const p=it.value/tot*100;
    seg+=`<div class="sh-seg" style="width:${p}%;background:${it.color}" title="${esc(it.label)}">${p>=9?`<span style="color:${idealText(it.color)}">${p.toFixed(0)}%</span>`:''}</div>`;
    leg+=`<div class="sh-row"><span class="sh-sw" style="background:${it.color}"></span><span class="sh-lb">${esc(it.label)}</span><span class="sh-vl mono">${fmtN(it.value)}</span><span class="sh-pc mono">${p.toFixed(1)}%</span></div>`;});
  return `<div class="sh"><div class="sh-bar">${seg}</div><div class="sh-leg">${leg}</div></div>`;}

/* ===== ALLOCATION: TARGET MIX + PATH-TO-TARGET ===== */
const CLS_ORDER=["Equity","Debt","Gold","Cash","Other"];
/* current market-value of each class from live holdings */
function curMixVals(){const v={};CLS_ORDER.forEach(c=>v[c]=0);(M.holds||[]).forEach(h=>{if(v[h.cls]!=null)v[h.cls]+=h.current;});return v;}
function pctOf(vals){const tot=CLS_ORDER.reduce((s,c)=>s+(vals[c]||0),0)||0;const p={};CLS_ORDER.forEach(c=>p[c]=tot?(vals[c]||0)/tot*100:0);p._tot=tot;return p;}
/* default target = current mix rounded to 100 (falls back to a plain split when portfolio is empty) */
function defaultTargets(){const p=pctOf(curMixVals());let t={};if(p._tot>0){CLS_ORDER.forEach(c=>t[c]=Math.round(p[c]));}else{t={Equity:60,Debt:20,Gold:10,Cash:5,Other:5};}
  const sum=CLS_ORDER.reduce((s,c)=>s+t[c],0);if(sum!==100&&sum>0){const big=CLS_ORDER.slice().sort((a,b)=>t[b]-t[a])[0];t[big]+=100-sum;}return t;}
function defaultPlan(){const c={},g={};CLS_ORDER.forEach(x=>{c[x]=0;g[x]=0;});return{contrib:c,growth:g,months:36,tol:2,_v:2};}
/* average monthly "salary" for the cash plan: Salary + Bonus, never RSU (RSU vests as shares, not take-home cash) */
function avgSalary(){if(!(M&&M.IS&&M.IS.incRows&&M.months&&M.months.length))return 0;const n=M.months.length;let tot=0;
  M.IS.incRows.forEach(r=>{const c=(r.cat||"").toLowerCase();if(/rsu/.test(c))return;if(/salary|bonus/.test(c))tot+=(r.m&&r.m._t)||0;});return tot/n;}
/* Cash monthly contribution auto-fills to: average take-home (salary+bonus) - what you invest elsewhere - average monthly spend */
function cashAuto(){const sal=avgSalary(),exp=(M&&M.R&&isFinite(M.R.avgMo))?M.R.avgMo:0,
  others=["Equity","Debt","Gold","Other"].reduce((s,c)=>s+(+(S.plan&&S.plan.contrib&&S.plan.contrib[c])||0),0);
  return{sal,exp,cash:sal-others-exp};}
/* step the portfolio forward month by month; contributions may be negative (selling down); a class can't go below 0 */
function projectMix(start,contrib,growth,months){const vals={};CLS_ORDER.forEach(c=>vals[c]=start[c]||0);const rows=[];
  for(let t=0;t<=months;t++){if(t>0)CLS_ORDER.forEach(c=>{vals[c]=Math.max(0,vals[c]*(1+(growth[c]||0)/100/12)+(contrib[c]||0));});
    const tot=CLS_ORDER.reduce((s,c)=>s+vals[c],0)||1;const pct={};CLS_ORDER.forEach(c=>pct[c]=vals[c]/tot*100);
    rows.push({t,vals:{...vals},pct,tot});}return rows;}
/* first month index where every class sits within tol of its target; -1 if never within horizon */
function firstConverge(rows,targets,tol){for(let i=0;i<rows.length;i++){if(CLS_ORDER.every(c=>Math.abs(rows[i].pct[c]-(targets[c]||0))<=tol))return i;}return -1;}
/* biggest remaining gap at a given row (for the "not reached" verdict) */
function worstGap(row,targets){let w={cls:null,gap:0};CLS_ORDER.forEach(c=>{const d=row.pct[c]-(targets[c]||0);if(Math.abs(d)>Math.abs(w.gap))w={cls:c,gap:d};});return w;}
function addMonths(n){const d=new Date();d.setMonth(d.getMonth()+n);return _MON[d.getMonth()]+" "+d.getFullYear();}

/* pct-share trajectories toward target bands */
function projChart(w,nMonths,series,targets,tol,hitM){
  const h=272,m={t:16,r:82,b:26,l:34},pw=w-m.l-m.r,ph=h-m.t-m.b,HI=100;
  const X=i=>m.l+(nMonths<=0?pw/2:pw*i/nMonths),Y=v=>m.t+ph-(v/HI)*ph;
  let s="";
  [0,25,50,75,100].forEach(g=>{const y=Y(g);s+=`<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1" opacity="${g===0?"1":".5"}"/><text class="cx-x" x="${(m.l-7).toFixed(1)}" y="${(y+3.4).toFixed(1)}" text-anchor="end">${g}</text>`;});
  const step=nMonths<=12?3:nMonths<=36?6:12;for(let t=0;t<=nMonths;t+=step)s+=`<text class="cx-x" x="${X(t).toFixed(1)}" y="${(m.t+ph+15).toFixed(1)}">${t===0?"now":"+"+t}</text>`;
  series.forEach(se=>{const tg=targets[se.cls];if(tg==null)return;const y=Y(tg),yb1=Y(Math.min(HI,tg+tol)),yb2=Y(Math.max(0,tg-tol));
    s+=`<rect x="${m.l}" y="${Math.min(yb1,yb2).toFixed(1)}" width="${pw.toFixed(1)}" height="${Math.abs(yb2-yb1).toFixed(1)}" style="fill:${se.color}" opacity=".07"/>`;
    s+=`<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${se.color}" stroke-width="1.1" stroke-dasharray="4 4" opacity=".75"/>`;});
  if(hitM>0){const xh=X(hitM);s+=`<line x1="${xh.toFixed(1)}" y1="${m.t}" x2="${xh.toFixed(1)}" y2="${(m.t+ph).toFixed(1)}" style="stroke:var(--rule)" stroke-width="1.3" stroke-dasharray="2 3"/><text class="cx-end" x="${xh.toFixed(1)}" y="${(m.t-4).toFixed(1)}" text-anchor="middle" style="fill:var(--rule)">on target +${hitM}mo</text>`;}
  const ends=[];
  series.forEach(se=>{const pts=se.data.map((v,i)=>[X(i),Y(v),v]);
    s+=`<path d="${spline(pts)}" fill="none" style="stroke:${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last=pts[pts.length-1];ends.push({x:last[0]+7,y:last[1],c:se.color,txt:se.cls+" "+last[2].toFixed(0)+"%"});});
  ends.sort((a,b)=>a.y-b.y);const gp=13;for(let i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<gp)ends[i].y=ends[i-1].y+gp;}
  ends.forEach(e=>{const yy=Math.max(m.t+6,Math.min(h-4,e.y+3.5));s+=`<text class="cx-end" x="${e.x.toFixed(1)}" y="${yy.toFixed(1)}" style="fill:${e.c}">${esc(e.txt)}</text>`;});
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`;}

/* compact stacked bar (no legend) for the now / projected / target comparison */
function miniStack(vals){const items=CLS_ORDER.map(c=>({label:c,value:vals[c]||0,color:clsColor(c)})).filter(i=>i.value>0);
  const tot=items.reduce((a,b)=>a+b.value,0)||1;
  return `<div class="sh-bar" style="height:26px">${items.map(it=>{const p=it.value/tot*100;return `<div class="sh-seg" style="width:${p}%;background:${it.color}" title="${esc(it.label)} ${p.toFixed(0)}%">${p>=11?`<span style="color:${idealText(it.color)}">${p.toFixed(0)}</span>`:""}</div>`;}).join("")}</div>`;}

/* ===== EXPORT ===== */
$("#btnExport").onclick=()=>{if(!S.loaded){toast("Import data first");return;}
  const wb=XLSX.utils.book_new();
  const tr=[["Date","Txn Kind","Type","From","To","Amount","Category","Sub-Category","Card","Group","Comment"],...S.txns.map(x=>[dstr(x.date),x.kind,txnType(x),x.from,x.to,x.amt,x.cat,x.sub,x.card||"",x.grp||"",x.com||""])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tr),"Transactions");
  const ir=[["Asset Class","Instrument Type","Name / Holding","Linked Account","Units","Avg Cost/Unit","Cur Price/Unit","Invested (if no units)","Value (if no units)"],...S.holdings.map(h=>[h.cls,h.type,h.name,h.acct,h.units,h.avg,h.price,h.minv,h.mval])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ir),"Investments");
  const ah=[["Account","Kind","Opening Balance"],...S.accounts.map(a=>[a.name,a.kind,a.open])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ah),"Lists");
  const sm=[["Metric","Value"],["Net worth",Math.round(M.netWorth)],["Total income",Math.round(M.IS.rev._t)],["Total expenses",Math.round(M.IS.exp._t)],["Net saved",Math.round(M.IS.net._t)],["Savings rate core",(M.R.saveCore*100).toFixed(1)+"%"],["Portfolio value",Math.round(M.portCur)],["Unrealised gain",Math.round(M.portCur-M.portInv)],["Liquid assets",Math.round(M.R.liquid)]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sm),"Summary");
  XLSX.writeFile(wb,"Ledger_export_"+new Date().toISOString().slice(0,10)+".xlsx");toast("Workbook exported");};

/* ===== CLEAR CACHE ===== */
$("#btnClear").onclick=()=>{
  if(!confirm("Clear this device's saved data?\n\nThis wipes the cached workbook, target mix and plan from local storage and reloads the app. Export first if you want a copy \u2014 nothing is sent anywhere.")) return;
  try{const t=localStorage.getItem(STORE+"_theme_v2");
    Object.keys(localStorage).filter(k=>k.indexOf(STORE)===0).forEach(k=>localStorage.removeItem(k));
    if(t)localStorage.setItem(STORE+"_theme_v2",t); // keep appearance choice
  }catch(e){}
  location.reload();
};

/* ===== NAV / THEME / PERSIST ===== */
const TITLES={overview:["Overview","Your finances at a glance"],txns:["Transactions","Every rupee, double-entry"],invest:["Investments","Portfolio at cost and market"],statements:["Statements","Income, balance sheet, cash flow"],trends:["Trends","Month by month"],budget:["Budget","Planned vs actual"],ratios:["Ratios","Your finances as a firm"],capture:["Quick Add","Log on the go, queue locally, merge into the workbook when ready"]};
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;$$("#nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");const v=b.dataset.v;$$(".view").forEach(s=>s.classList.remove("on"));$("#v-"+v).classList.add("on");$("#viewTitle").textContent=TITLES[v][0];$("#viewSub").textContent=TITLES[v][1];window.scrollTo(0,0);};
function setTheme(t){if(t!=="noir"&&t!=="swiss")t="swiss";document.documentElement.dataset.theme=t;$$("#themePick .tp").forEach(b=>b.classList.toggle("on",b.dataset.t===t));try{localStorage.setItem(STORE+"_theme_v2",t);}catch(e){}if(S.loaded)render();}
$$("#themePick .tp").forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
function persist(){try{localStorage.setItem(STORE,JSON.stringify({txns:S.txns,holdings:S.holdings,accounts:S.accounts,cats:S.cats,subcats:S.subcats,budget:S.budget,targetMix:S.targetMix,plan:S.plan}));}catch(e){}}
function restore(){try{setTheme(localStorage.getItem(STORE+"_theme_v2")||"swiss");const raw=localStorage.getItem(STORE);if(raw){const d=JSON.parse(raw);if(d.txns&&d.txns.length){S.txns=d.txns;S.holdings=d.holdings||[];if(d.accounts)S.accounts=d.accounts;if(d.cats)S.cats=d.cats;if(d.subcats)S.subcats=d.subcats;if(d.budget)S.budget=d.budget;if(d.targetMix)S.targetMix=d.targetMix;if(d.plan)S.plan=d.plan;S.loaded=true;}}}catch(e){}}
function toast(m){const t=$("#toast");t.innerHTML=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
let _rz;addEventListener("resize",()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(S.loaded)render();},180);});
restore();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
